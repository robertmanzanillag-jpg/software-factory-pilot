name: Factory authorized publication
run-name: '${{ inputs.operation }}:${{ inputs.job_id }}'
on:
  workflow_dispatch:
    inputs:
      base_sha: {required: true, type: string}
      head_sha: {required: true, type: string}
      target: {required: true, type: choice, options: [staging, production]}
      operation: {required: true, type: choice, options: [deploy, rollback]}
      job_id: {required: true, type: string}
permissions: {}
concurrency:
  group: pilot-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'robertmanzanillag-jpg/software-factory-pilot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment:
      name: github-pages
      url: https://robertmanzanillag-jpg.github.io/software-factory-pilot/
    permissions: {contents: write, pages: write, id-token: write}
    env:
      RELEASE_BASE: ${{ inputs.base_sha }}
      RELEASE_HEAD: ${{ inputs.head_sha }}
      RELEASE_TARGET: ${{ inputs.target }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      RELEASE_JOB: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 1
        with: {persist-credentials: false}
      - name: Verify ledger and build immutable publication
        timeout-minutes: 2
        run: node scripts/release-command.mjs build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        timeout-minutes: 1
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        timeout-minutes: 1
        with: {path: out/release, retention-days: 1}
      - name: Revalidate active job and release gate
        timeout-minutes: 1
        run: node scripts/release-command.mjs authorize
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        timeout-minutes: 2
        with: {timeout: 120000}
