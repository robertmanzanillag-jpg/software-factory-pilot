name: Factory pilot candidate checks
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: factory-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated-checks:
    if: github.repository == 'robertmanzanillag-jpg/software-factory-pilot' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NODE_IMAGE: docker.io/library/node@sha256:c0a93797ee78814ae6d32fcca2561fdbbe423149c3f5389aad32d86e9fd85bd4
      BROWSER_IMAGE: mcr.microsoft.com/playwright@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    steps:
      - name: Verify exact candidate and trusted harness
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_REF_NAME" =~ ^factory/([a-f0-9]{40})-([a-f0-9]{64})$ ]]
          base="${BASH_REMATCH[1]}"
          mkdir checkout source baseline trusted
          git -C checkout init --quiet
          timeout --kill-after=5 40 git -C checkout -c credential.helper= fetch --quiet --depth 2 https://github.com/robertmanzanillag-jpg/software-factory-pilot.git "$GITHUB_SHA" "$base"
          test "$(git -C checkout rev-parse "$GITHUB_SHA^")" = "$base"
          test "$(git -C checkout rev-list --parents -n 1 "$GITHUB_SHA" | wc -w)" -eq 2
          test "$(git -C checkout diff --name-only "$base" "$GITHUB_SHA")" = "site/index.html"
          git -C checkout show "$base:.github/workflows/candidate.yml" > trusted/base.yml
          git -C checkout show "$GITHUB_SHA:.github/workflows/candidate.yml" > trusted/head.yml
          cmp trusted/base.yml trusted/head.yml
          git -C checkout show "$base:scripts/candidate-browser.mjs" > trusted/candidate-browser.mjs
          git -C checkout archive "$GITHUB_SHA" site scripts/site.mjs tests/site.test.mjs | tar -x -C source
          git -C checkout archive "$base" site scripts/site.mjs tests/site.test.mjs | tar -x -C baseline
          test -z "$(find source baseline -type l -print -quit)"
          test "$(du -sk source | cut -f1)" -lt 1024
          test "$(du -sk baseline | cut -f1)" -lt 1024
          timeout --kill-after=5 90 docker pull "$NODE_IMAGE" >/dev/null
          timeout --kill-after=5 120 docker pull "$BROWSER_IMAGE" >/dev/null
      - name: Isolated tests
        shell: bash
        run: |
          set -euo pipefail
          container="factory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-0"
          cleanup() { timeout --kill-after=5 10 docker rm -f "$container" >/dev/null 2>&1 || true; remaining=$(timeout --kill-after=5 10 docker ps -aq --filter "name=^/${container}$") || return 1; test -z "$remaining"; }
          trap 'status=$?; cleanup || status=1; exit "$status"' EXIT
          timeout --kill-after=5 60 docker run --rm --init --name "$container" --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --memory 2g --cpus 2 --pids-limit 256 --shm-size 256m \
            --tmpfs /tmp:rw,nosuid,size=256m,mode=1777 --tmpfs /work:rw,nosuid,size=64m,mode=1777 \
            --env HOME=/tmp --env GITHUB_SHA="$GITHUB_SHA" --env CANDIDATE_SHA="$GITHUB_SHA" \
            --mount "type=bind,src=$PWD/source,dst=/source,readonly" \
            --mount "type=bind,src=$PWD/trusted,dst=/harness,readonly" \
            --workdir /work "$NODE_IMAGE" sh -c 'cp -R /source/. /work/ && node --test tests/site.test.mjs'
      - name: Isolated build
        shell: bash
        run: |
          set -euo pipefail
          container="factory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-1"
          cleanup() { timeout --kill-after=5 10 docker rm -f "$container" >/dev/null 2>&1 || true; remaining=$(timeout --kill-after=5 10 docker ps -aq --filter "name=^/${container}$") || return 1; test -z "$remaining"; }
          trap 'status=$?; cleanup || status=1; exit "$status"' EXIT
          timeout --kill-after=5 30 docker run --rm --init --name "$container" --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --memory 2g --cpus 2 --pids-limit 256 --shm-size 256m \
            --tmpfs /tmp:rw,nosuid,size=256m,mode=1777 --tmpfs /work:rw,nosuid,size=64m,mode=1777 \
            --env HOME=/tmp --env GITHUB_SHA="$GITHUB_SHA" --env CANDIDATE_SHA="$GITHUB_SHA" \
            --mount "type=bind,src=$PWD/source,dst=/source,readonly" \
            --mount "type=bind,src=$PWD/trusted,dst=/harness,readonly" \
            --workdir /work "$NODE_IMAGE" sh -c 'cp -R /source/. /work/ && node scripts/site.mjs build'
      - name: Isolated browser recovery tests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^factory/([a-f0-9]{40})-([a-f0-9]{64})$ ]]
          base="${BASH_REMATCH[1]}"
          container="factory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-2"
          cleanup() { timeout --kill-after=5 10 docker rm -f "$container" >/dev/null 2>&1 || true; remaining=$(timeout --kill-after=5 10 docker ps -aq --filter "name=^/${container}$") || return 1; test -z "$remaining"; }
          trap 'status=$?; cleanup || status=1; exit "$status"' EXIT
          timeout --kill-after=5 90 docker run --rm --init --name "$container" --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --memory 2g --cpus 2 --pids-limit 256 --shm-size 256m \
            --tmpfs /tmp:rw,nosuid,size=256m,mode=1777 --tmpfs /work:rw,nosuid,size=64m,mode=1777 \
            --env HOME=/tmp --env BASE_SHA="$base" --env HEAD_SHA="$GITHUB_SHA" \
            --mount "type=bind,src=$PWD/source,dst=/source,readonly" \
            --mount "type=bind,src=$PWD/baseline,dst=/baseline,readonly" \
            --mount "type=bind,src=$PWD/trusted,dst=/harness,readonly" \
            --workdir /work "$BROWSER_IMAGE" sh -c 'mkdir baseline candidate && cp -R /baseline/. baseline/ && cp -R /source/. candidate/ && (cd baseline && GITHUB_SHA="$BASE_SHA" node scripts/site.mjs build) && (cd candidate && GITHUB_SHA="$HEAD_SHA" node scripts/site.mjs build) && BROWSER_VARIANT=baseline CANDIDATE_SHA="$BASE_SHA" node /harness/candidate-browser.mjs && BROWSER_VARIANT=candidate CANDIDATE_SHA="$HEAD_SHA" node /harness/candidate-browser.mjs'
